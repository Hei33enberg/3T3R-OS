# cymru-os Rust workspace (Apache-2.0)
# Daemons + shared crates for the CYMRU RAYDIO convergence layer.
[workspace]
resolver = "2"
members = [
    "services/crcp",
    "services/cymru-radio-d",
    "services/cymru-bridge-d",
    "services/cymru-mesh-d",
    "services/cymru-otad",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Hei33enberg/cymru-os"

[workspace.dependencies]
crcp = { path = "services/crcp" }
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
