# 3T3R OS Rust workspace (Apache-2.0)
# Daemons + shared crates for the 3T3R RAYDIO convergence layer.
# Note: crate/dir slugs (cymru-*-d), D-Bus names (org.cymru.*) and the CRCP wire
# magic stay on the `cymru` slug on purpose — they are build/wire identifiers the
# app talks to, exactly like the app's cymru_* DB tables. Only the brand is 3T3R.
[workspace]
resolver = "2"
members = [
    "services/crcp",
    "services/robot-adapters",
    "services/cymru-radio-d",
    "services/cymru-bridge-d",
    "services/cymru-mesh-d",
    "services/cymru-otad",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Hei33enberg/cymru-os"

[workspace.dependencies]
crcp = { path = "services/crcp" }
ed25519-dalek = "2"
reed-solomon = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
