[package]
name = "cymru-radio-d"
description = "LoRa/HF radio daemon: RFC 0001 framing + TDM priority queue (e-stop preempts) + carrier mux. SX1262 SPI driver is Linux-only (TODO)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
crcp = { workspace = true }
reed-solomon = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# SX1262 SPI driver deps are Linux-only; gated so the daemon logic builds/tests
# cross-platform (CI on Linux pulls these; dev on macOS/Windows builds the core).
[target.'cfg(target_os = "linux")'.dependencies]
spidev = "0.6"
linux-embedded-hal = "0.4"
